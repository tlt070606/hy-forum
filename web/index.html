<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      /**
       * 视口适配脚本（照抄 uni-app 官方模板）。
       *
       * 为什么用 document.write 而不是直接写 meta：
       * 需要在运行时判断设备是否支持 `env(safe-area-inset-*)`（刘海屏/全面屏安全区），
       * 只有支持时才加 `viewport-fit=cover`，否则老设备上会出渲染异常。
       * 这段必须在 <body> 之前同步执行，所以不能放到 Vue 里。
       */
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
          (coverSupport ? ', viewport-fit=cover' : '') +
          '" />'
      )
    </script>
    <title>Hy论坛</title>
    <!--
      站点图标（favicon）。
      ⚠️ 之前没有这一行 → 浏览器会去请求 `/favicon.ico` → **404**，
         在控制台留下一条 "Failed to load resource: 404"，看起来像应用坏了。
      用**内联 SVG data URI** 而不是放一个 png 文件：零新增资源、不涉及三端路径，
      且 SVG 图标在书签栏缩放时依然清晰。
      配色与设计令牌主色一致（#6b4bc4）；favicon 读不到 SCSS 变量，只能写字面值，
      所以改主色时这里要一起改（已在交付报告里记一笔）。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236b4bc4'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='bold' fill='%23ffffff' text-anchor='middle' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E"
    />
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
