# =============================================================
# Hy论坛 后端 —— 测试配置（profile = test）
#
# 归属：W1-M1 任务独占（见 docs/agents/工作计划.md §2）。
# 共享测试基类（com.hyforum.support.**）只引用本文件、不另建一份。
#
# 环境事实（docs/agents/README.md §7.2，均为实测过的事实，不要臆改）：
#   - MySQL 8.0.34 在本机 127.0.0.1:3306，root/1234；测试库 hy_forum_test
#     由 scripts/init_test_db.ps1 每次重建（DDL 从 docs/db/schema.sql 派生）
#
# ⚠️ 2026-09-17：库名改为**可配**（`${TEST_DB:hy_forum_test}`）。
#    为什么：2026-09-16 实测两次「并行跑集成测试会造假红」——全量从 40 秒膨胀到 8 分 18 秒，
#    以及一次 8 失败 / 24 错误（确认无并发后同一份代码 49/49）。根因是共享同一张库：
#    init_test_db.ps1 会 DROP/CREATE 整库、TestTableCleaner 会 TRUNCATE 全表，
#    两个 JVM 会互相清掉对方的数据。**所以并行开工的两条流必须各用一个库**：
#      1) powershell -File scripts/init_test_db.ps1 -TestDb hy_forum_test_m4
#      2) $env:TEST_DB='hy_forum_test_m4'  （再跑 mvn test）
#    不设 TEST_DB 时行为与从前完全一致（仍是 hy_forum_test）。
#    ⚠️ 假红比慢更危险：它会让人去查一个不存在的 bug。这条是花钱买来的教训。
#   - Redis 在 VMware VM 里：192.168.100.128:6380（本机 Windows 无 Redis，
#     且已决策不装 Docker Desktop；不使用 Testcontainers，见 docs/testing/README.md §3.1）
#
# ⚠️ 本文件里的口令只针对**本机开发实例**的测试库，与 docs/agents/README.md §7.2
#    登记的开发环境事实一致；它不是生产密钥，也不允许被复制到主配置里
#    （铁律 5：部署连接信息一律走环境变量，见 main/resources/application.yml）。
# =============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/${TEST_DB:hy_forum_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      # 测试串行执行，连接池只要够用即可；
      # 并发测试（M4 的 20 线程点赞）会临时占满，10 已有余量
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: 192.168.100.128
      port: 6380
      password:
      database: 0
      timeout: 3s

  # 让"无匹配 handler"也抛异常，从而走全局异常处理器返回契约里的 404
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    # 测试跑起来时不要被 MyBatis-Plus / Sa-Token 的 INFO 淹没；
    # 出问题时把这两行临时改成 DEBUG 即可
    com.hyforum: INFO
    com.baomidou.mybatisplus: WARN
    cn.dev33.satoken: WARN

hy:
  captcha:
    # 契约值 300s（技术方案 §6.2 / §7）。
    # 测试**显式**配置成 300，而不是依赖默认值 —— 这样 M1_captcha_ttl_is_300s
    # 断言的就是"契约要求的值真的被配置进来了"，而不是"代码里的兜底默认值"。
    ttl-seconds: 300
    width: 130
    height: 48
    length: 4
  # 注意：这里**没有** register-mode-cache-seconds 之类的注册模式缓存配置项。
  # 注册模式读取刻意不缓存（每次直读 sys_config），以保证契约 §8.8 的
  # "切换后行为立即变化、无需重启"。配置项本身不存在，就没有"缓存多久"可调，
  # 也就不会出现"有人把缓存 TTL 调大导致切换延迟"的漂移
  # （取舍说明见 com.hyforum.auth.mode.RegisterModeService 的类注释）。
  rate-limit:
    # 与 M1ErrorCodesTest.RATE_LIMIT_QUOTA 保持一致：需要验证 429 的用例
    # 自己把这个配额打满；其余用例每次 @BeforeEach 会清掉限流键，
    # 因此不会出现"上限太低导致无关用例随机变红"。
    ip-per-minute: 50

# -------------------------------------------------------------
# OSS 测试占位值（⚠️ 下面两个**不是真实密钥**，只是为了让 `media` 的凭据绑定
# 通过 @NotBlank 校验：主配置里两个密钥默认为空 = 生产上不设环境变量就起不来
# （fail-fast，见 application.yml 的说明与任务书 §5 裁决 ②）。
#
# 若这里不补占位值，**所有** @SpringBootTest 上下文都会因校验失败而起不来 ——
# M1 与 M3 第一段的 44 个用例会集体变红，而原因与被测行为毫无关系。
#
# 归属说明：本文件原为 W1-M1 任务独占；这两行由 L1 于 2026-09-16 授权
# M3 第二交付段追加（任务书 §10 的 CR-D 裁决），值在 CR-F 落地时调整过一次。
#
# ⚠️ 两个值**刻意不共享 6 字符以上的共同片段**（早先两者都以 `test-` 开头，导致
#    "响应体不得含 secret 子串"那条守卫被 key id 里的公共前缀误报 —— 守卫本身是对的，
#    是这两份 fixture 长得太像）。改值时请保持它们互不包含对方的 6 字符片段。
# -------------------------------------------------------------
aliyun:
  oss:
    access-key-id: TEST-KEYID-1234567890
    access-key-secret: not-a-real-secret-abcdefghij

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
